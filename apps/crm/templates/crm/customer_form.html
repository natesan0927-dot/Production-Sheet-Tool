{% extends "base.html" %}
{% block title %}{% if object %}Edit Customer{% else %}Add Customer{% endif %}{% endblock %}
{% block content %}
<h4 class="mb-3">{% if object %}Edit Customer{% else %}Add Customer{% endif %}</h4>
<div class="card" style="max-width:760px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-primary btn-sm">Save Customer</button>
    </form>
  </div>
</div>
{% endblock %}
