{% extends "base.html" %}
{% block title %}Mark Lead as Lost{% endblock %}
{% block content %}
<h4 class="mb-3 text-danger">Mark {{ lead.lead_id }} as Lost</h4>
<div class="card" style="max-width:640px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-danger btn-sm">Confirm Lost</button>
      <a href="{% url 'crm:lead_detail' lead.pk %}" class="btn btn-outline-secondary btn-sm">Cancel</a>
    </form>
  </div>
</div>
{% endblock %}
