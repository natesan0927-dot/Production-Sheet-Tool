{% extends "base.html" %}
{% block title %}Request Rough Measurement{% endblock %}
{% block content %}
<h4 class="mb-1">Request Rough Measurement</h4>
<div class="text-muted small mb-3">{{ lead.lead_id }} — {{ lead.customer.customer_name }}</div>
<div class="card" style="max-width:640px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-primary btn-sm">Create Measurement Request</button>
    </form>
  </div>
</div>
{% endblock %}
