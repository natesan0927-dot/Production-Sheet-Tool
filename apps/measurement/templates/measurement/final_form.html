{% extends "base.html" %}
{% block title %}Final Measurement{% endblock %}
{% block content %}
<h4 class="mb-1">Start Final Measurement</h4>
<div class="text-muted small mb-3">{{ order.order_number }} — {{ order.customer.customer_name }}</div>
<div class="card" style="max-width:600px">
  <div class="card-body">
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "core/_form_fields.html" %}
      <button class="btn btn-primary btn-sm">Create Final Measurement Task</button>
    </form>
  </div>
</div>
{% endblock %}
