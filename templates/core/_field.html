{% load widget_tweaks %}
<div class="mb-3">
  <label class="form-label small fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span class="text-danger">*</span>{% endif %}</label>
  {% if field.field.choices %}{{ field|add_class:"form-select form-select-sm" }}{% else %}{{ field|add_class:"form-control form-control-sm" }}{% endif %}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% if field.errors %}<div class="text-danger small">{{ field.errors }}</div>{% endif %}
</div>
