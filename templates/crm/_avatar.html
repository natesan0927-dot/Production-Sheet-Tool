{% comment %}
The presenter. Eyes blink on their own; the mouth only moves while the
surrounding .tw-wt-avatar carries .is-speaking.
{% endcomment %}
<svg class="tw-av" viewBox="0 0 200 250" role="img" aria-label="Your guide">
  <defs>
    <linearGradient id="tw-av-hat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0DA96"/><stop offset="55%" stop-color="#D9AF3E"/><stop offset="100%" stop-color="#B8901F"/>
    </linearGradient>
    <linearGradient id="tw-av-shirt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2E8BD6"/><stop offset="100%" stop-color="#1D5FA6"/>
    </linearGradient>
    <radialGradient id="tw-av-halo" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="100" cy="118" r="95" fill="url(#tw-av-halo)"/>

  {# shoulders #}
  <g class="tw-av-body">
    <path d="M44 250c0-33 25-56 56-56s56 23 56 56z" fill="url(#tw-av-shirt)"/>
    <path d="M100 194c9 0 17 2 24 5l-24 26-24-26c7-3 15-5 24-5z" fill="#0E2140"/>
    <circle cx="100" cy="232" r="5" fill="#D9AF3E"/>
  </g>

  {# the arm that gestures towards the screen #}
  <g class="tw-av-arm">
    <path d="M150 214c14-6 24-19 27-34" stroke="url(#tw-av-shirt)" stroke-width="17" stroke-linecap="round" fill="none"/>
    <circle cx="180" cy="176" r="10" fill="#E8B98A"/>
  </g>

  <g class="tw-av-head">
    <rect x="62" y="70" width="76" height="86" rx="34" fill="#E8B98A"/>
    <path d="M62 112h-6a7 7 0 0 0 0 14h6zM138 112h6a7 7 0 0 1 0 14h-6z" fill="#DCA87A"/>

    {# hard hat #}
    <path d="M52 78a48 48 0 0 1 96 0z" fill="url(#tw-av-hat)"/>
    <rect x="46" y="74" width="108" height="11" rx="5.5" fill="url(#tw-av-hat)"/>
    <path d="M100 32c5 0 8 3 8 8v38h-16V40c0-5 3-8 8-8z" fill="#B8901F" opacity=".45"/>

    <g class="tw-av-eyes">
      <ellipse cx="84" cy="112" rx="6" ry="7.5" fill="#0B2244"/>
      <ellipse cx="116" cy="112" rx="6" ry="7.5" fill="#0B2244"/>
      <circle cx="86" cy="110" r="2" fill="#fff"/>
      <circle cx="118" cy="110" r="2" fill="#fff"/>
    </g>
    <path d="M76 99c5-3 11-3 16 0M108 99c5-3 11-3 16 0" stroke="#0B2244" stroke-width="3" stroke-linecap="round" fill="none"/>

    <g class="tw-av-mouth">
      <ellipse cx="100" cy="136" rx="11" ry="8" fill="#8A3A41"/>
      <ellipse cx="100" cy="132" rx="9" ry="3" fill="#fff" opacity=".9"/>
    </g>
    <ellipse cx="72" cy="128" rx="6" ry="4" fill="#D98A6E" opacity=".35"/>
    <ellipse cx="128" cy="128" rx="6" ry="4" fill="#D98A6E" opacity=".35"/>
  </g>
</svg>
