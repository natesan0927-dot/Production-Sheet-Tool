{% extends "base.html" %}
{% block title %}Add Lead{% endblock %}

{% block content %}
<h4 class="mb-3">Add Lead</h4>
<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-6">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="mt-4">
        <button class="btn btn-primary">Save Lead</button>
        <a href="{% url 'crm:lead_list' %}" class="btn btn-link">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
