{% extends "base.html" %}
{% block title %}Dispatch{% endblock %}

{% block content %}
<h4 class="mb-1">Dispatch</h4>
<p class="text-muted">{{ lead.lead_number }} — {{ lead.customer_name }}</p>

<div class="card">
  <div class="card-body">
    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      <div class="row g-3">
        {% for field in form %}
        <div class="col-md-4">
          <label class="form-label">{{ field.label }}</label>
          {{ field }}
          {% if field.errors %}<div class="text-danger small">{{ field.errors.0 }}</div>{% endif %}
        </div>
        {% endfor %}
      </div>
      <div class="mt-4">
        <button class="btn btn-primary">Confirm Dispatch</button>
        <a href="{{ next|default:lead.get_absolute_url }}" class="btn btn-link">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
